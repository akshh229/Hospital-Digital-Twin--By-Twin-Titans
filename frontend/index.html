<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef7fa" />
    <script>
      ;(() => {
        const savedTheme = localStorage.getItem('lazarus-theme')
        const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light'
        const root = document.documentElement
        root.classList.add(theme)
        root.style.colorScheme = theme

        const themeColor = theme === 'dark' ? '#09111a' : '#eef7fa'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', themeColor)
      })()
    </script>
    <title>St. Jude ICU Digital Twin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-lazarus-bg text-lazarus-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
